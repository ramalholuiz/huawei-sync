name: Bug
description: Report a reproducible defect.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduce
      description: Exact steps and device/app versions.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Sanitized logs, screenshots, or diagnostics. Do not include health payloads or raw provider ids.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: No private health payload or raw provider identifier is included.
          required: true

